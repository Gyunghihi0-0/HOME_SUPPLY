name: VWorld credentials and official response check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/vworld-check.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently verify both APIs without checkout
        env:
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          VWORLD_DOMAIN: ${{ vars.VWORLD_DOMAIN || 'https://gyunghihi0-0.github.io/HOME_SUPPLY/' }}
        shell: python
        run: |
          import os,json,sys,urllib.request,urllib.parse,urllib.error
          key=os.environ.get('VWORLD_API_KEY','').strip()
          domain=os.environ.get('VWORLD_DOMAIN','').strip()
          print('SECRET_PRESENT='+str(bool(key)))
          print('DOMAIN_CONFIGURED='+str(bool(domain)))
          if not key:sys.exit(1)
          checks=[
           ('geocoder','address',dict(service='address',request='getcoord',version='2.0',crs='EPSG:4326',address='경기도 성남시 분당구 정자동 90',format='json',type='PARCEL')),
           ('district_2d','data',dict(service='data',request='GetFeature',version='2.0',data='LT_C_ADSIGG_INFO',format='json',size=1,page=1,geometry='false',attribute='true',crs='EPSG:4326',geomFilter='BOX(127.09,37.35,127.11,37.37)'))]
          failed=False
          for label,path,params in checks:
           params['key']=key
           if domain:params['domain']=domain
           try:
            req=urllib.request.Request('https://api.vworld.kr/req/'+path+'?'+urllib.parse.urlencode(params),headers={'User-Agent':'HomeSupplyApiValidation/1.0','Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=25) as response:
             raw=response.read(2000001)
            if len(raw)>2000000:raise ValueError('oversize')
            data=json.loads(raw)['response']
            status=data.get('status')
            code=str(data.get('error',{}).get('code',''))
            code=code if len(code)<80 and all(c.isalnum() or c=='_' for c in code) else 'UNKNOWN'
            if status=='OK':
             result=data.get('result',{})
             shape=isinstance(result.get('point'),dict) if path=='address' else isinstance(result.get('featureCollection',{}).get('features'),list)
             print(label+(': PASS authenticated response_shape_verified' if shape else ': FAIL response_shape'))
             failed=failed or not shape
            else:
             print(label+': FAIL api_code='+code);failed=True
           except urllib.error.HTTPError as exc:
            print(label+': FAIL http_status='+str(exc.code));failed=True
           except Exception as exc:
            print(label+': FAIL error_type='+type(exc).__name__);failed=True
          sys.exit(1 if failed else 0)

  browser:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official browser tooling without repository checkout
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify official APIs using a normal Chromium session
        env:
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          VWORLD_DOMAIN: ${{ vars.VWORLD_DOMAIN || 'https://gyunghihi0-0.github.io/HOME_SUPPLY/' }}
        shell: bash
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
           const key=(process.env.VWORLD_API_KEY||'').trim();
           if(!key){console.log('browser: FAIL missing_secret');process.exitCode=1;return;}
           const domain=process.env.VWORLD_DOMAIN;
           const browser=await chromium.launch({headless:true});
           try {
            const context=await browser.newContext();
            const page=await context.newPage();
            for (const [label,path,params] of [
             ['geocoder','address',{service:'address',request:'getcoord',version:'2.0',crs:'EPSG:4326',address:'경기도 성남시 분당구 정자동 90',format:'json',type:'PARCEL'}],
             ['district_2d','data',{service:'data',request:'GetFeature',version:'2.0',data:'LT_C_ADSIGG_INFO',format:'json',size:'1',geometry:'false',attribute:'true',crs:'EPSG:4326',geomFilter:'BOX(127.09,37.35,127.11,37.37)'}]
            ]) {
             try {
              const url='https://api.vworld.kr/req/'+path+'?'+new URLSearchParams({...params,key,domain});
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
              if(response.status()!==200){console.log('browser_'+label+': FAIL http_status='+response.status());process.exitCode=1;continue;}
              const data=JSON.parse(await page.locator('body').innerText()).response;
              if(data.status==='OK'){console.log('browser_'+label+': PASS authenticated');}
              else{const code=String(data.error?.code||'UNKNOWN');console.log('browser_'+label+': FAIL api_code='+(/^[A-Z_]{1,80}$/.test(code)?code:'UNKNOWN'));process.exitCode=1;}
             } catch {console.log('browser_'+label+': FAIL navigation_or_response');process.exitCode=1;}
            }
           } finally {await browser.close();}
          })().catch(()=>{console.log('browser: FAIL startup');process.exitCode=1;});
          JS
