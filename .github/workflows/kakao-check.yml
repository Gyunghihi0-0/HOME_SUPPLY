name: Kakao address connectivity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/kakao-check.yml']
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify key and real address responses without checkout
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.parse, urllib.error
          key = os.environ.get('KAKAO_REST_API_KEY', '').strip()
          print('key_configured=' + str(bool(key)).lower())
          if not key:
              raise SystemExit(1)
          failed = False
          for label, address in [('reference', '경기도 성남시 분당구 판교역로 166'), ('yangpyeong_target', '경기도 양평군 양서면 용담리 212-3'), ('gwangmyeong_target', '경기도 광명시 구름산지구 A6블록')]:
              url = 'https://dapi.kakao.com/v2/local/search/address.json?' + urllib.parse.urlencode({'query': address, 'analyze_type': 'exact'})
              req = urllib.request.Request(url, headers={'Authorization': 'KakaoAK ' + key})
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      data = json.load(response)
                  docs = data.get('documents', [])
                  valid = [d for d in docs if 124 <= float(d['x']) <= 132 and 33 <= float(d['y']) <= 39 and d.get('address', {}).get('b_code')]
                  print(label + ': documents=' + str(len(docs)) + ', valid_coordinates_and_law_code=' + str(len(valid)))
                  if not valid and label == 'reference':
                      failed = True
              except urllib.error.HTTPError as exc:
                  print(label + ': HTTP_' + str(exc.code))
                  failed = True
              except Exception as exc:
                  print(label + ': ' + type(exc).__name__)
                  failed = True
          raise SystemExit(1 if failed else 0)
