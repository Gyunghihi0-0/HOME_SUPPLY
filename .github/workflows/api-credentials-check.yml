name: Verify official API credentials
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/api-credentials-check.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: never run PR or repository scripts with these credentials.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only authentication and response-field checks
        env:
          APPLYHOME_SERVICE_KEY: ${{ secrets.APPLYHOME_SERVICE_KEY }}
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          MOLIT_GENERAL_SERVICE_KEY: ${{ secrets.MOLIT_GENERAL_SERVICE_KEY }}
        shell: python
        run: |
          import os, json, math
          from datetime import date
          from decimal import Decimal
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.parse import urlencode
          from urllib.error import HTTPError, URLError
          import xml.etree.ElementTree as ET

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = build_opener(NoRedirect())
          failed = False
          today = date.today()
          required = {'sggCd','umdNm','aptNm','jibun','dealAmount','excluUseAr',
                      'dealYear','dealMonth','dealDay','floor','buildYear','cdealType','cdealDay'}
          checks = [
              ('applyhome', 'APPLYHOME_SERVICE_KEY',
               'https://api.odcloud.kr/api/ApplyhomeInfoDetailSvc/v1/getAPTLttotPblancDetail',
               {'page':1, 'perPage':10}),
              ('molit_detail_15126468', 'MOLIT_SERVICE_KEY',
               'https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev',
               {'LAWD_CD':'41463','DEAL_YMD':today.strftime('%Y%m'),'pageNo':1,'numOfRows':100}),
              ('molit_general_15126469', 'MOLIT_GENERAL_SERVICE_KEY',
               'https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade',
               {'LAWD_CD':'41463','DEAL_YMD':today.strftime('%Y%m'),'pageNo':1,'numOfRows':100})
          ]
          for label, env_name, endpoint, params in checks:
              key = os.environ.get(env_name, '').strip()
              if not key:
                  print(f'{label}: FAIL missing_secret {env_name}')
                  failed = True
                  continue
              params['serviceKey'] = key
              request = Request(endpoint+'?'+urlencode(params), headers={'User-Agent':'HomeSupplyApiValidation/1.0'})
              try:
                  with opener.open(request, timeout=45) as response:
                      raw = response.read(10_000_001)
                  if len(raw) > 10_000_000:
                      raise ValueError('oversize')
                  if label == 'applyhome':
                      payload = json.loads(raw)
                      if not isinstance(payload.get('data'), list) or 'totalCount' not in payload:
                          print(f'{label}: FAIL response_shape')
                          failed = True
                          continue
                      fields = {'HOUSE_MANAGE_NO','PBLANC_NO','HOUSE_NM','HSSPLY_ADRES'}
                      if any(not fields <= row.keys() for row in payload['data']):
                          print(f'{label}: FAIL required_fields_missing')
                          failed = True
                          continue
                      print(f'{label}: PASS authenticated records_checked={len(payload["data"])}')
                  else:
                      root = ET.fromstring(raw)
                      code = root.findtext('.//resultCode')
                      if code not in ('000','00'):
                          # Only known numeric codes are logged, never server messages or URLs.
                          safe_code = code if code and code.isdigit() and len(code) <= 4 else 'unknown'
                          print(f'{label}: FAIL api_result_code={safe_code}')
                          failed = True
                          continue
                      items = root.findall('.//items/item')
                      missing = set()
                      active = cancelled = invalid = 0
                      for item in items:
                          row = {c.tag:(c.text or '').strip() for c in item}
                          missing |= required - row.keys()
                          if not required <= row.keys():
                              continue
                          if row['cdealType'] or row['cdealDay']:
                              cancelled += 1
                              continue
                          try:
                              amount = Decimal(row['dealAmount'].replace(',','')) * 10000
                              area = float(row['excluUseAr'])
                              date(int(row['dealYear']),int(row['dealMonth']),int(row['dealDay']))
                              int(row['floor'])
                              year = int(row['buildYear'])
                              if not (amount.is_finite() and amount > 0 and amount == amount.to_integral_value()
                                      and math.isfinite(area) and area > 0 and 1900 <= year <= today.year
                                      and row['sggCd'] == '41463'):
                                  raise ValueError('invalid')
                              active += 1
                          except Exception:
                              invalid += 1
                      if missing or invalid:
                          print(f'{label}: FAIL missing_fields={",".join(sorted(missing)) or "none"} invalid_rows={invalid}')
                          failed = True
                      else:
                          print(f'{label}: PASS authenticated records_checked={len(items)} active={active} cancelled_excluded={cancelled}')
                          if not items:
                              print(f'{label}: NOTE no_trade_rows_for_field_validation')
              except HTTPError as exc:
                  print(f'{label}: FAIL http_status={exc.code}')
                  failed = True
              except URLError:
                  print(f'{label}: FAIL network_error')
                  failed = True
              except Exception:
                  print(f'{label}: FAIL response_parse_or_validation_error')
                  failed = True
          raise SystemExit(1 if failed else 0)
